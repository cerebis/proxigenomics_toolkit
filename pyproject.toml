[build-system]
requires = ["setuptools==80.9.0", "wheel", "Cython", "numpy<=1.26"]
build-backend = "setuptools.build_meta"

[project]
dynamic = ["version"]
name = "proxigenomics_toolkit"
description = "A collection of classes and methods for the analysis of 3C-based sequencing data"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    {name = "Matthew Z DeMaere", email = "matt.demaere@gmail.com"}
]
keywords = ["bioinformatics", "3C", "genomics", "metagenomics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: POSIX :: Linux",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "gfa_io @ git+https://github.com/cerebis/gfa_io#egg=gfa_io-99",
    "lap @ git+https://github.com/gatagat/lap@master#egg=lap-99",
    "astropy",
    "biopython<1.79",
    "cython",
    "matplotlib",
    "networkx>=3.1",
    "numba",
    "numpy<=1.26",
    "pandas",
    "python-louvain",
    "pysam",
    "PyYAML",
    "scipy",
    "seaborn",
    "scikit-learn~=1.5.2",
    "sparse",
    "statsmodels",
    "tqdm",
    "typing",
    "llvmlite",
    "scikeras~=0.13.0",
    "tensorflow ; sys_platform == 'linux'",
    "tensorflow~=2.16.1 ; sys_platform == 'darwin'",
    "tensorflow-metal~=1.2.0 ; sys_platform == 'darwin'",
    "keras~=3.10.0",
    "umap-learn",
    "imbalanced-learn",
    "plotnine"
]

[dependency-groups]
docs = ["sphinx"]
test = ["pytest == 8.3.5"]
lint = ["mypy == 1.16.0", "ruff == 0.11.12"]
dev = [
    {include-group = "test"},
    {include-group = "lint"},
    {include-group = "docs"},
]

[project.urls]
Homepage = "https://github.com/cerebis/proxigenomics_toolkit"
Repository = "https://github.com/cerebis/proxigenomics_toolkit.git"

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.package-data]
proxigenomics_toolkit = ["external/*"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["proxigenomics_toolkit*"]
exclude = ["proxigenomics_toolkit.egg-info*"]
namespaces = false

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]
log_cli = false
log_cli_level = "DEBUG"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
disallow_untyped_defs = true

[tool.ruff]
line-length = 120
indent-width = 4

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = [
    "F",   # pyflakes
    "E",   # pycodestyle
    "I",   # isort
    "ANN", # flake8 type annotations
    "RUF", # ruff-specific rules
]
fixable = ["ALL"]

[tool.ruff.lint.pydocstyle]
convention = "google"